  <style>
    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .thanks-inner {
      max-width: 560px;
    }

    .thanks-icon {
      font-size: 64px;
      color: var(--accent-color, #ff4d4f);
      margin-bottom: 24px;
      display: block;
    }

    .thanks-inner h1 {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--heading-color, #fff);
    }

    .thanks-inner p {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .thanks-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .thanks-actions a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: .3s;
    }

    .thanks-btn-primary {
      background: var(--accent-color, #ff4d4f);
      color: #fff;
    }

    .thanks-btn-primary:hover {
      background: color-mix(in srgb, var(--accent-color, #ff4d4f), #000 18%);
      color: #fff;
    }

    .thanks-btn-secondary {
      color: var(--default-color, #e9e9e9);
      border: 1px solid color-mix(in srgb, var(--default-color, #e9e9e9), transparent 75%);
    }

    .thanks-btn-secondary:hover {
      border-color: var(--accent-color, #ff4d4f);
      color: var(--accent-color, #ff4d4f);
    }

    @media (max-width: 575px) {
      .thanks-inner h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body class="index-page">

  <main class="main">
    <div class="thanks-wrap">
      <div class="thanks-inner">
        <i class="bi bi-envelope-check thanks-icon"></i>
        <h1>Message sent</h1>
        <p>Thanks for reaching out &mdash; your message came through and I'll get back to you as soon as I can.</p>
        <div class="thanks-actions">
          <a href="/" class="thanks-btn-primary"><i class="bi bi-arrow-left"></i> Back to the site</a>
          <a href="https://www.linkedin.com/in/joshua-franco4" class="thanks-btn-secondary" target="_blank"
            rel="noopener"><i class="bi bi-linkedin"></i> Connect on LinkedIn</a>
        </div>
      </div>
    </div>
  </main>
